name: DeepEval Tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
  LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}

jobs:
  deepeval:
    name: DeepEval LLM Evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: llmapp09/deepeval-tests/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r llmapp09/deepeval-tests/requirements.txt

      - name: Build and start backend
        run: docker compose -f llmapp09/docker-compose.yml up -d llm-multiroute

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/api/ai/routes >/dev/null; then
              echo "Backend is ready."
              exit 0
            fi
            echo "Attempt $i/30 - backend not ready yet..."
            sleep 5
          done
          echo "Backend failed to start."
          docker compose -f llmapp09/docker-compose.yml logs llm-multiroute
          exit 1

      - name: Run DeepEval suites
        working-directory: llmapp09/deepeval-tests
        run: |
          deepeval test run test_classify.py -v
          deepeval test run test_sentiment.py -v
          deepeval test run test_summarize.py -v
          deepeval test run test_intent.py -v

      - name: Tear down backend
        if: always()
        run: docker compose -f llmapp09/docker-compose.yml down
