name: PromptFoo Tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL }}
  LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
  LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
  LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}

jobs:
  promptfoo-eval:
    name: PromptFoo Evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and start backend
        run: docker compose -f llmapp09/docker-compose.yml up -d llm-multiroute

      - name: Wait for backend to be ready
        run: |
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/api/ai/routes >/dev/null; then
              echo "Backend is ready."
              exit 0
            fi
            echo "Attempt $i/30 - backend not ready yet..."
            sleep 5
          done
          echo "Backend failed to start."
          docker compose -f llmapp09/docker-compose.yml logs llm-multiroute
          exit 1

      - name: Run PromptFoo evaluations
        working-directory: llmapp09/promptfoo-tests
        run: |
          npx promptfoo@latest eval -c classify.yaml
          npx promptfoo@latest eval -c sentiment.yaml
          npx promptfoo@latest eval -c summarize.yaml
          npx promptfoo@latest eval -c intent.yaml

      - name: Tear down backend
        if: always()
        run: docker compose -f llmapp09/docker-compose.yml down
